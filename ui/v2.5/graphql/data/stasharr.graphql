fragment UserTierData on UserTier {
  id
  name
  description
  allowed_paths
  blocked_tags {
    id
    name
  }
  required_tags {
    id
    name
  }
  can_download
  can_view_reels
  user_count
}

fragment UserData on User {
  id
  username
  role
  disabled
  has_api_key
  last_login_at
  created_at
  tier {
    id
    name
  }
}

fragment CurrentUserData on CurrentUser {
  username
  role
  is_owner
  tier
  can_download
  can_view_reels
  multi_user_enabled
}

fragment ReelData on Reel {
  id
  duration
  width
  height
  source
  stream
  created_at
  segments {
    start
    end
  }
  scene {
    id
    title
    date
    files {
      path
    }
    paths {
      screenshot
    }
    studio {
      id
      name
    }
    performers {
      id
      name
    }
  }
}

fragment LibraryWatcherConfigData on LibraryWatcherConfig {
  enabled
  debounce_seconds
  identify
  generate_reels
  generate_media
  create_missing
  audio_enabled
  audio_extensions
  poll_minutes
  reel_duration
  reel_count
  identify_sources
  running
  watched_paths
  last_check_at
  last_result
}

fragment TrashItemData on TrashItem {
  id
  original_path
  trash_path
  size
  is_dir
  deleted_at
  purge_at
}

fragment TrashConfigData on TrashConfig {
  enabled
  retention_days
  trash_path
}

fragment DuplicateCleanupSceneData on Scene {
  id
  title
  date
  organized
  paths {
    screenshot
  }
  studio {
    id
    name
  }
  files {
    id
    path
    size
    width
    height
    bit_rate
    duration
    video_codec
  }
}

fragment RenamerConfigData on RenamerConfig {
  enabled
  template
  default_template
  tokens {
    token
    description
  }
}

fragment PlaylistData on Playlist {
  id
  name
  description
  watch_later
  scene_count
  updated_at
  cover {
    id
    paths {
      screenshot
    }
  }
}
