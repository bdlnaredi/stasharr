query Me {
  me {
    ...CurrentUserData
  }
}

query Users {
  users {
    ...UserData
  }
}

query UserTiers {
  userTiers {
    ...UserTierData
  }
}

query FindReels($page: Int, $per_page: Int, $seed: Int, $start_id: ID) {
  findReels(page: $page, per_page: $per_page, seed: $seed, start_id: $start_id) {
    count
    reels {
      ...ReelData
    }
  }
}

query SceneReels($id: ID!) {
  findScene(id: $id) {
    id
    reels {
      ...ReelData
    }
  }
}

query LibraryWatcherConfig {
  libraryWatcherConfig {
    ...LibraryWatcherConfigData
  }
}

query TrashBin {
  trashBin {
    config {
      ...TrashConfigData
    }
    total_size
    items {
      ...TrashItemData
    }
  }
}

query DuplicateCleanupPreview($input: DuplicateCleanupInput!) {
  duplicateCleanupPreview(input: $input) {
    keep {
      ...DuplicateCleanupSceneData
    }
    remove {
      ...DuplicateCleanupSceneData
    }
  }
}

query RenamerConfig {
  renamerConfig {
    ...RenamerConfigData
  }
}

query RenamePreview($input: RenameScenesInput!) {
  renamePreview(input: $input) {
    checked
    to_rename
    items {
      scene_id
      title
      old_path
      new_path
      status
      reason
    }
  }
}

query FindPlaylists {
  findPlaylists {
    ...PlaylistData
  }
}

query FindPlaylist($id: ID!) {
  findPlaylist(id: $id) {
    ...PlaylistData
    smart_rule {
      filter
      sort
      direction
      limit
    }
    scenes {
      ...SlimSceneData
    }
  }
}

query SmartPlaylistRows($limit: Int) {
  findPlaylists {
    id
    name
    smart
    scenes(limit: $limit) {
      ...SlimSceneData
    }
  }
}

query ContinueWatching($limit: Int) {
  continueWatching(limit: $limit) {
    ...SlimSceneData
  }
}

query ScenePlaylists($id: ID!) {
  findScene(id: $id) {
    id
    in_watch_later
    playlist_ids
  }
}

query TrashEnabled {
  trashBin {
    config {
      enabled
    }
  }
}

query FindSimilarScenes($scene_id: ID!, $limit: Int) {
  findSimilarScenes(scene_id: $scene_id, limit: $limit) {
    ...SlimSceneData
  }
}

query RecommendedScenes($limit: Int) {
  recommendedScenes(limit: $limit) {
    ...SlimSceneData
  }
}

query NotifySettings {
  notifyTargets {
    ...NotifyTargetData
  }
  notifyEvents {
    id
    label
  }
}

query MaintenanceSettings {
  maintenanceConfig {
    ...MaintenanceConfigData
  }
  databaseBackups {
    id
    name
    scheduled
    size
    created_at
    schema_version
    includes_blobs
  }
}

query AIMarkerConfig {
  aiMarkerConfig {
    ...AIMarkerConfigData
  }
}

query AITaggerStatus {
  aiTaggerStatus {
    reachable
    ok
    loading
    error
    device
    gpu
    model
    done
    total
  }
}

query AIMarkerSuggestions($page: Int, $per_page: Int) {
  aiMarkerSuggestions(page: $page, per_page: $per_page) {
    count
    scenes
    suggestions {
      id
      label
      seconds
      end_seconds
      score
      scene {
        id
        title
        files {
          path
          duration
        }
        paths {
          screenshot
          stream
        }
      }
    }
  }
}

mutation ConfigureAIMarkers($input: AIMarkerConfigInput!) {
  configureAIMarkers(input: $input) {
    ...AIMarkerConfigData
  }
}

mutation RunAIMarkers($scene_ids: [ID!]) {
  runAIMarkers(scene_ids: $scene_ids)
}

mutation AIMarkerApprove($ids: [ID!]!) {
  aiMarkerApprove(ids: $ids)
}

mutation AIMarkerReject($ids: [ID!]!) {
  aiMarkerReject(ids: $ids)
}

query TagClipProgress {
  tagClipProgress {
    done
    total
  }
}

mutation MakeTagClips($tag_ids: [ID!], $redo: Boolean) {
  makeTagClips(tag_ids: $tag_ids, redo: $redo)
}

query StasharrStats($days: Int) {
  stasharrStats(days: $days) {
    days
    totals {
      scenes
      duration
      size
      performers
      tags
      studios
      reels
      reel_views
      comments
      users
      plays
    }
    added_by_month {
      month
      scenes
      size
    }
    resolutions {
      id
      name
      count
    }
    plays_by_day {
      day
      plays
    }
    top_scenes {
      plays
      scene {
        id
        title
        files {
          path
        }
        paths {
          screenshot
        }
      }
    }
    top_performers {
      id
      name
      count
    }
    top_tags {
      id
      name
      count
    }
    top_reels {
      reel_id
      views
      scene {
        id
        title
        files {
          path
        }
      }
    }
    users {
      id
      name
      role
      plays
      last_play
      last_login
    }
    recent_plays {
      user
      at
      scene {
        id
        title
        files {
          path
        }
      }
    }
    generated {
      name
      bytes
    }
    generated_total
  }
}
