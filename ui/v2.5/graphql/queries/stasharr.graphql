query Me {
  me {
    ...CurrentUserData
  }
}

query Users {
  users {
    ...UserData
  }
}

query UserTiers {
  userTiers {
    ...UserTierData
  }
}

query FindReels($page: Int, $per_page: Int, $seed: Int, $start_id: ID) {
  findReels(page: $page, per_page: $per_page, seed: $seed, start_id: $start_id) {
    count
    reels {
      ...ReelData
    }
  }
}

query SceneReels($id: ID!) {
  findScene(id: $id) {
    id
    reels {
      ...ReelData
    }
  }
}

query LibraryWatcherConfig {
  libraryWatcherConfig {
    ...LibraryWatcherConfigData
  }
}

query TrashBin {
  trashBin {
    config {
      ...TrashConfigData
    }
    total_size
    items {
      ...TrashItemData
    }
  }
}

query DuplicateCleanupPreview($input: DuplicateCleanupInput!) {
  duplicateCleanupPreview(input: $input) {
    keep {
      ...DuplicateCleanupSceneData
    }
    remove {
      ...DuplicateCleanupSceneData
    }
  }
}

query RenamerConfig {
  renamerConfig {
    ...RenamerConfigData
  }
}

query RenamePreview($input: RenameScenesInput!) {
  renamePreview(input: $input) {
    checked
    to_rename
    items {
      scene_id
      title
      old_path
      new_path
      status
      reason
    }
  }
}

query FindPlaylists {
  findPlaylists {
    ...PlaylistData
  }
}

query FindPlaylist($id: ID!) {
  findPlaylist(id: $id) {
    ...PlaylistData
    smart_rule {
      filter
      sort
      direction
      limit
    }
    scenes {
      ...SlimSceneData
    }
  }
}

query SmartPlaylistRows($limit: Int) {
  findPlaylists {
    id
    name
    smart
    scenes(limit: $limit) {
      ...SlimSceneData
    }
  }
}

query ContinueWatching($limit: Int) {
  continueWatching(limit: $limit) {
    ...SlimSceneData
  }
}

query ScenePlaylists($id: ID!) {
  findScene(id: $id) {
    id
    in_watch_later
    playlist_ids
  }
}

query TrashEnabled {
  trashBin {
    config {
      enabled
    }
  }
}

query FindSimilarScenes($scene_id: ID!, $limit: Int) {
  findSimilarScenes(scene_id: $scene_id, limit: $limit) {
    ...SlimSceneData
  }
}

query RecommendedScenes($limit: Int) {
  recommendedScenes(limit: $limit) {
    ...SlimSceneData
  }
}

query NotifySettings {
  notifyTargets {
    ...NotifyTargetData
  }
  notifyEvents {
    id
    label
  }
}

query MaintenanceSettings {
  maintenanceConfig {
    ...MaintenanceConfigData
  }
  databaseBackups {
    id
    name
    scheduled
    size
    created_at
    schema_version
    includes_blobs
  }
}
