fragment SiteSceneCard on Scene {
  id
  title
  date
  created_at
  details
  resume_time
  in_watch_later
  files {
    path
    duration
    width
    height
  }
  paths {
    screenshot
    preview
  }
  studio {
    id
    name
    image_path
  }
  performers {
    id
    name
    gender
    image_path
  }
}

fragment SiteModelCard on Performer {
  id
  name
  disambiguation
  gender
  image_path
  scene_count
  favorite
  country
  birthdate
}

fragment SiteConfigData on SiteConfig {
  enabled
  audience
  style
  name
  tagline
  featured
  featured_tag {
    id
    name
  }
  models_gender
  applies_to_me
  home_rows {
    type
    title
    enabled
    tag {
      id
      name
    }
  }
  promo {
    enabled
    text
    link
    image
  }
  age_gate
  accent
  logo_url
  app_look
}

query SiteConfig {
  siteConfig {
    ...SiteConfigData
  }
}

query SiteSceneList($kind: SiteSceneKind!, $page: Int, $per_page: Int, $performer_id: ID) {
  siteScenes(kind: $kind, page: $page, per_page: $per_page, performer_id: $performer_id) {
    count
    scenes {
      ...SiteSceneCard
    }
  }
}

query SiteScenes($filter: FindFilterType, $scene_filter: SceneFilterType) {
  findScenes(filter: $filter, scene_filter: $scene_filter) {
    count
    scenes {
      ...SiteSceneCard
    }
  }
}

query SiteModels($filter: FindFilterType, $performer_filter: PerformerFilterType) {
  findPerformers(filter: $filter, performer_filter: $performer_filter) {
    count
    performers {
      ...SiteModelCard
    }
  }
}

query SiteModel($id: ID!) {
  findPerformer(id: $id) {
    ...SiteModelCard
    site_favorite
    alias_list
    ethnicity
    hair_color
    eye_color
    height_cm
    measurements
    fake_tits
    career_start
    career_end
    tattoos
    piercings
    details
    tags {
      id
      name
    }
  }
}

query SiteStudios($filter: FindFilterType, $studio_filter: StudioFilterType) {
  findStudios(filter: $filter, studio_filter: $studio_filter) {
    count
    studios {
      id
      name
      image_path
      scene_count
    }
  }
}

query SiteStudio($id: ID!) {
  findStudio(id: $id) {
    id
    name
    image_path
    scene_count
    details
  }
}

query SiteTags($filter: FindFilterType, $tag_filter: TagFilterType) {
  findTags(filter: $filter, tag_filter: $tag_filter) {
    count
    tags {
      id
      name
      image_path
      scene_count
    }
  }
}

query SiteTag($id: ID!) {
  findTag(id: $id) {
    id
    name
    image_path
    scene_count
    description
  }
}

query SiteHomeExtras {
  continueWatching(limit: 12) {
    ...SiteSceneCard
  }
  recommendedScenes(limit: 12) {
    ...SiteSceneCard
  }
}

query SiteSimilar($scene_id: ID!) {
  findSimilarScenes(scene_id: $scene_id, limit: 12) {
    ...SiteSceneCard
  }
}

query SiteMyList {
  findPlaylists {
    id
    watch_later
    scenes {
      ...SiteSceneCard
    }
  }
}

query SiteSceneExtras($id: ID!) {
  findScene(id: $id) {
    id
    rating100
    site_liked
    in_watch_later
    site_rating {
      average
      count
    }
  }
}

query SiteLiked($page: Int, $per_page: Int) {
  siteLikedScenes(page: $page, per_page: $per_page) {
    count
    scenes {
      ...SiteSceneCard
    }
  }
}

query SiteFromFavorites($page: Int, $per_page: Int) {
  siteFromFavorites(page: $page, per_page: $per_page) {
    count
    scenes {
      ...SiteSceneCard
    }
  }
}

query SiteFavoriteModels {
  siteFavoriteModels {
    ...SiteModelCard
  }
}

query SiteCoStars($performer_id: ID!) {
  siteCoStars(performer_id: $performer_id, limit: 12) {
    scenes
    performer {
      ...SiteModelCard
    }
  }
}

query SiteFilterOptions {
  findTags(
    filter: { per_page: 150, sort: "scenes_count", direction: DESC }
    tag_filter: { scene_count: { value: 0, modifier: GREATER_THAN } }
  ) {
    tags {
      id
      name
    }
  }
  findStudios(
    filter: { per_page: 150, sort: "scenes_count", direction: DESC }
    studio_filter: { scene_count: { value: 0, modifier: GREATER_THAN } }
  ) {
    studios {
      id
      name
    }
  }
}
