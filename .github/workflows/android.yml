name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STASHARR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STASHARR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STASHARR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # the private signing key from the repository secrets
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STASHARR_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing key missing::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/stasharr.jks"
          export STASHARR_KEYSTORE="$RUNNER_TEMP/stasharr.jks"
          # check the key opens before building, with a clear message if not
          if ! keytool -list -keystore "$STASHARR_KEYSTORE" -storepass "$STASHARR_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keys.txt" 2>&1; then
            echo "::error title=Signing key does not open::The ANDROID_KEYSTORE_BASE64 secret is not a keystore, or ANDROID_KEYSTORE_PASSWORD is wrong. $(tail -1 "$RUNNER_TEMP/keys.txt")"
            exit 1
          fi
          alias="${STASHARR_KEY_ALIAS:-stasharr}"
          if ! grep -qi "^$alias," "$RUNNER_TEMP/keys.txt"; then
            found=$(grep -i "PrivateKeyEntry" "$RUNNER_TEMP/keys.txt" | cut -d, -f1 | tr '\n' ' ')
            echo "::error title=Key alias not found::The keystore has no key called '$alias'. Set the ANDROID_KEY_ALIAS secret to one of: $found"
            exit 1
          fi
          set -o pipefail
          if ! gradle assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # show the compiler errors as an annotation on the run
            msg=$(grep -E "^e: |What went wrong|^> [^T]|Could not resolve|error:" -A2 "$RUNNER_TEMP/build.log" \
              | grep -v "^--$" | head -80 | sed "s#file://$GITHUB_WORKSPACE/android/app/src/main/java/##" \
              | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Android build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Stasharr-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Stasharr-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/Stasharr-${{ env.VERSION_NAME }}.apk

      - name: Publish a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: Stasharr for Android ${{ env.VERSION_NAME }}
          make_latest: true
          body: |
            Download **Stasharr-${{ env.VERSION_NAME }}.apk** below on your Android phone and open it to install.
            The first time, Android asks you to allow installing apps from your browser or files app.
            New versions install over the old one; your login is kept.
          files: ${{ runner.temp }}/Stasharr-${{ env.VERSION_NAME }}.apk
