# Stasharr: auto generated short vertical reels

type ReelSegment {
  "Start in the source scene, in seconds"
  start: Float!
  "End in the source scene, in seconds"
  end: Float!
}

type Reel {
  id: ID!
  scene: Scene!
  duration: Float!
  width: Int!
  height: Int!
  "How the moments were chosen: MARKERS, HEATMAP or ANALYSIS"
  source: String!
  segments: [ReelSegment!]!
  "URL of the reel video"
  stream: String!
  "URL of a picture from the reel, made the first time it is asked for"
  cover: String!
  created_at: Time!
}

type FindReelsResultType {
  count: Int!
  reels: [Reel!]!
}

input GenerateReelsInput {
  "Scenes to make reels for. Leave empty for every scene that does not have a reel yet."
  scene_ids: [ID!]
  "Reel length in seconds. Defaults to the setting (15)."
  duration: Float
  "Reels per scene, 1 to 5. Defaults to the setting (3)."
  count: Int
  "Replace existing reels"
  overwrite: Boolean
}

type LibraryWatcherConfig {
  "Watch library folders and scan new files as they appear"
  enabled: Boolean!
  "Seconds to wait after the last change before scanning, so downloads can finish"
  debounce_seconds: Int!
  "Identify new scenes after scanning"
  identify: Boolean!
  "Generate a reel for new scenes after identifying"
  generate_reels: Boolean!
  "Generate covers, previews and sprites for new files"
  generate_media: Boolean!
  "Create studios, performers and tags that are not in the library yet"
  create_missing: Boolean!
  "Add audio files to the library as scenes"
  audio_enabled: Boolean!
  "File extensions treated as audio"
  audio_extensions: [String!]!
  "Minutes between checks for changes that file events miss (network shares). 0 turns polling off."
  poll_minutes: Int!
  "Default reel length in seconds"
  reel_duration: Float!
  "Reels made per scene, each from a different part"
  reel_count: Int!
  "The identify sources used, in order"
  identify_sources: [String!]!
  "Whether the watcher is running"
  running: Boolean!
  "Folders being watched"
  watched_paths: [String!]!
  "When the watcher last looked for new files"
  last_check_at: Time
  "What the last check found"
  last_result: String
}

input LibraryWatcherConfigInput {
  enabled: Boolean
  debounce_seconds: Int
  identify: Boolean
  generate_reels: Boolean
  generate_media: Boolean
  create_missing: Boolean
  audio_enabled: Boolean
  audio_extensions: [String!]
  poll_minutes: Int
  reel_duration: Float
  reel_count: Int
}

extend type Scene {
  reels: [Reel!]!
}

extend type Query {
  "Reels, newest first"
  "Newest first, or shuffled with a seed (any number; keep it for the next pages). start_id puts that reel first."
  findReels(page: Int, per_page: Int, seed: Int, start_id: ID): FindReelsResultType!
  libraryWatcherConfig: LibraryWatcherConfig!
}

extend type Mutation {
  "Editor or admin. Returns the job id."
  generateReels(input: GenerateReelsInput!): ID!
  "Editor or admin"
  reelDestroy(id: ID!): Boolean!
  "Editor or admin. Looks for new files in every library folder now."
  libraryWatcherCheckNow: Boolean!
  "Editor or admin. Identifies scenes that have no studio or no performers again. Returns the job id."
  libraryWatcherReidentify: ID!
  "Admin only"
  configureLibraryWatcher(input: LibraryWatcherConfigInput!): LibraryWatcherConfig!
}
