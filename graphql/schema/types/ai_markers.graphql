# Stasharr: markers found by the Stasharr Tagger

type AIMarkerLabel {
  "The marker's title and tag"
  name: String!
  "What it looks like, in plain English, for the model"
  prompt: String!
  enabled: Boolean!
  "false: only used to recognise frames that should not get a marker"
  marker: Boolean!
  "Where in a scene it can be found: end, start, or empty for anywhere"
  when: String!
  "This label's own confidence, 0 to 1; 0 uses the general one"
  min_confidence: Float!
  "Reviewed suggestions it learned from"
  kept_examples: Int!
  thrown_examples: Int!
}

input AIMarkerLabelInput {
  name: String!
  prompt: String!
  enabled: Boolean!
  marker: Boolean!
  when: String
  min_confidence: Float
}

type AIMarkerConfig {
  "AI markers on or off"
  enabled: Boolean!
  "Search by description on or off"
  search_enabled: Boolean!
  "Tag clips on or off"
  tag_clips_enabled: Boolean!
  "Trans, Lesbian and Bisexual ribbons on scenes"
  scene_badges_enabled: Boolean!
  "The Stasharr Tagger's address, e.g. http://stasharr-tagger:2705. Empty turns AI markers off."
  url: String!
  "Seconds between frames that are looked at"
  interval: Float!
  "How sure the tagger must be, 0 to 1"
  min_confidence: Float!
  "How long something must last to get a marker, in seconds"
  min_seconds: Float!
  "Look at new scenes as they are imported"
  auto: Boolean!
  "Suggestions wait for approval before they become markers"
  review: Boolean!
  labels: [AIMarkerLabel!]!
  default_labels: [AIMarkerLabel!]!
}

input AIMarkerConfigInput {
  enabled: Boolean
  search_enabled: Boolean
  tag_clips_enabled: Boolean
  scene_badges_enabled: Boolean
  url: String
  interval: Float
  min_confidence: Float
  min_seconds: Float
  auto: Boolean
  review: Boolean
  "Empty list restores the default labels"
  labels: [AIMarkerLabelInput!]
}

type AITaggerStatus {
  reachable: Boolean!
  ok: Boolean!
  loading: Boolean!
  error: String
  "cpu or cuda"
  device: String
  "The NVIDIA card's name"
  gpu: String
  model: String
  "The tagger can average several descriptions per label and learn from reviews"
  learns: Boolean!
  "Scenes looked at"
  done: Int!
  "Scenes in the library"
  total: Int!
}

type AIMarkerSuggestion {
  id: ID!
  scene: Scene!
  label: String!
  seconds: Float!
  end_seconds: Float!
  "How sure the tagger was, 0 to 1"
  score: Float!
}

type AIMarkerSuggestionResult {
  count: Int!
  "How many scenes have suggestions"
  scenes: Int!
  suggestions: [AIMarkerSuggestion!]!
}

extend type Query {
  "Admin only"
  aiMarkerConfig: AIMarkerConfig!
  "Admin only"
  aiTaggerStatus: AITaggerStatus!
  "Admin only. Suggestions waiting for review."
  aiMarkerSuggestions(page: Int, per_page: Int): AIMarkerSuggestionResult!
}

extend type Mutation {
  "Admin only"
  configureAIMarkers(input: AIMarkerConfigInput!): AIMarkerConfig!
  "Admin only. Looks at these scenes again, or every scene not looked at yet. Returns the job id."
  "redo looks at every scene again; waiting suggestions are replaced, kept markers stay"
  runAIMarkers(scene_ids: [ID!], redo: Boolean): ID!
  "Forgets what AI markers learned from reviews, for one label or all"
  aiForgetExamples(label: String): Boolean!
  "Admin only. Turns suggestions into markers. Returns how many were made."
  aiMarkerApprove(ids: [ID!]!): Int!
  "Admin only. Throws suggestions away."
  aiMarkerReject(ids: [ID!]!): Int!
}

extend type Scene {
  "Ribbons for the scene: trans, lesbian or bisexual, from the performers' genders and the tags"
  stasharr_badges: [String!]!
}
