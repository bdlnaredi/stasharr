# Stasharr site: a storefront style front end for viewers

enum SiteSceneKind {
  "Chosen by the admin's featured setting"
  FEATURED
  "Most watched by everyone, all time"
  POPULAR
  "Most watched by everyone in the last two weeks"
  TRENDING
  "Best average rating across everyone"
  TOP_RATED
}

type SiteSceneResult {
  count: Int!
  scenes: [Scene!]!
}

type SiteConfig {
  "Whether the site front end is on"
  enabled: Boolean!
  "viewers: users with the Viewer role; non_admins: viewers and editors"
  audience: String!
  "The look: velvet, neon, crimson, blush or onyx"
  style: String!
  name: String!
  tagline: String!
  "top_rated, popular, recent, random or tag"
  featured: String!
  "With featured = tag, the tag whose scenes are featured"
  featured_tag: Tag
  "FEMALE shows only women on the models pages; ALL shows everyone"
  models_gender: String!
  "Whether the current user is sent to the site"
  applies_to_me: Boolean!
  "The rows on the home page, in order"
  home_rows: [SiteHomeRow!]!
  promo: SitePromo!
  "Ask visitors to confirm they are adults before the site opens"
  age_gate: Boolean!
  "Accent colour (#rrggbb) used instead of the style's own; empty for the style's"
  accent: String!
  "Address of the uploaded logo image, if any"
  logo_url: String
  "Give site users the site's name, colours and rows in the Android app too"
  app_look: Boolean!
  "What plays behind the login form: previews, pictures or off"
  login_backdrop: String!
  "With a tag, the login page only shows scenes with it"
  login_backdrop_tag: Tag
}

type SiteHomeRow {
  "continue, latest, models, trending, popular, recommended, top_rated, favorites, liked, reels, categories, channels or tag"
  type: String!
  "Heading; empty uses the default for the type"
  title: String!
  "For type tag"
  tag: Tag
  enabled: Boolean!
}

input SiteHomeRowInput {
  type: String!
  title: String
  tag_id: ID
  enabled: Boolean!
}

type SitePromo {
  enabled: Boolean!
  text: String!
  "Where the banner goes when clicked, for example /site/category/12"
  link: String!
  "Background picture address"
  image: String!
}

input SitePromoInput {
  enabled: Boolean!
  text: String!
  link: String!
  image: String!
}

type SiteRating {
  "Average of every user's rating, 1-100; null when nobody has rated"
  average: Float
  count: Int!
}

type SiteCoStar {
  performer: Performer!
  scenes: Int!
}

extend type Scene {
  "Whether the current user liked the scene on the site"
  site_liked: Boolean!
  site_rating: SiteRating!
  "How many times the scene was played, by everyone"
  site_views: Int!
  "How many comments the scene has"
  site_comment_count: Int!
}

type SiteComment {
  id: ID!
  author: String!
  body: String!
  created_at: Time!
  "Written while watching one of the scene's reels"
  from_reel: Boolean!
  "Written by the current user"
  mine: Boolean!
  "The current user may delete it: their own, or any for admins"
  can_delete: Boolean!
}

type SiteCommentResult {
  count: Int!
  comments: [SiteComment!]!
}

extend type Performer {
  "Whether the current user follows this model on the site"
  site_favorite: Boolean!
}

input SiteConfigInput {
  home_rows: [SiteHomeRowInput!]
  promo: SitePromoInput
  age_gate: Boolean
  accent: String
  app_look: Boolean
  login_backdrop: String
  "Empty for any scene"
  login_backdrop_tag_id: ID
  enabled: Boolean
  audience: String
  style: String
  name: String
  tagline: String
  featured: String
  featured_tag_id: ID
  models_gender: String
}

extend type Query {
  siteConfig: SiteConfig!
  siteScenes(kind: SiteSceneKind!, page: Int, per_page: Int, performer_id: ID): SiteSceneResult!
  "The current user's liked scenes, most recent first"
  siteLikedScenes(page: Int, per_page: Int): SiteSceneResult!
  "The current user's favourite models"
  siteFavoriteModels: [Performer!]!
  "Newest scenes with the current user's favourite models"
  siteFromFavorites(page: Int, per_page: Int): SiteSceneResult!
  "Models who most often appear with the given one"
  siteCoStars(performer_id: ID!, limit: Int): [SiteCoStar!]!
  "A scene's comments, newest first"
  siteComments(scene_id: ID!, page: Int, per_page: Int): SiteCommentResult!
}

extend type Mutation {
  "Admin only"
  configureSite(input: SiteConfigInput!): SiteConfig!
  "Admin only. A data: URL of a PNG, JPEG, WebP or SVG image, or empty to remove the logo."
  siteSetLogo(data: String!): SiteConfig!
  "Likes or unlikes a scene. Returns whether it is now liked."
  siteToggleLike(scene_id: ID!): Boolean!
  "Follows or unfollows a model. Returns whether they are now a favourite."
  siteToggleFavoriteModel(performer_id: ID!): Boolean!
  "Adds a comment to a scene. reel_id when written on a reel."
  siteAddComment(scene_id: ID!, body: String!, reel_id: ID): SiteComment!
  "Deletes a comment: your own, or any for admins"
  siteDeleteComment(id: ID!): Boolean!
  "Counts one watch of a reel. Returns the new total."
  reelAddView(id: ID!): Int!
}
